<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #e2dbd0;
      margin: 40px;
      font-family: 'Instrument Sans', sans-serif;
    }
    .col-test {
      background: #fffdf8;
      border-radius: 24px;
      width: 320px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .action-info {
      background: #fbf5e9;
      border: 1.5px solid #e6dbc4;
      border-radius: 16px;
      padding: 10px 12px;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div style="display: flex; gap: 40px;">
    <!-- Option A: Bricolage Grotesque -->
    <div class="col-test">
      <h3>Option A: Bricolage Grotesque</h3>
      
      <!-- Phone Image Directly -->
      <img src="../home_screen.png" style="width: 195px; height: auto; display: block; margin: 10px auto;">
      
      <div class="action-info">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 13px; color: #1c1a24; text-transform: uppercase; letter-spacing: -0.01em;">
          Download Anticipate today!
        </div>
        <div style="display: flex; gap: 10px;">
          <div style="width: 105px; height: 30px; background: black; border-radius: 5px;"></div>
          <div style="width: 102px; height: 30px; background: black; border-radius: 5px;"></div>
        </div>
      </div>
    </div>

    <!-- Option B: JetBrains Mono -->
    <div class="col-test">
      <h3>Option B: JetBrains Mono</h3>
      
      <!-- Phone Image Directly -->
      <img src="../home_screen.png" style="width: 195px; height: auto; display: block; margin: 10px auto;">
      
      <div class="action-info">
        <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; color: #1c1a24; text-transform: uppercase; letter-spacing: 0.05em;">
          Download Anticipate today!
        </div>
        <div style="display: flex; gap: 10px;">
          <div style="width: 105px; height: 30px; background: black; border-radius: 5px;"></div>
          <div style="width: 102px; height: 30px; background: black; border-radius: 5px;"></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
