<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #e2dbd0;
      margin: 40px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .col-test {
      background: #fffdf8;
      border-radius: 24px;
      width: 350px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-logo {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.04em;
      color: #1c1a24;
    }
    .brand-tagline {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: #e9694a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Test C: Sage 30px, Gap 3px, Tagline shifted right by 16px -->
  <div class="col-test">
    <h4>Test C: Sage 30px, Gap 3px, Tagline shifted right (16px)</h4>
    <div style="width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 3px; margin-bottom: 2px;">
        <svg width="30" height="30" viewBox="0 0 100 100" fill="none" style="display: block;">
          <circle cx="50" cy="62" r="30" fill="#FFD4B8" stroke="#e9694a" stroke-width="3.5" />
          <path d="M50 32 L50 20" stroke="#5fab84" stroke-width="5" stroke-linecap="round" />
          <ellipse cx="42" cy="14" rx="6" ry="10" fill="#5fab84" />
          <ellipse cx="58" cy="14" rx="6" ry="10" fill="#5fab84" />
          <path d="M44 68 Q 50 74, 56 68" stroke="#1c1a24" stroke-width="3.5" stroke-linecap="round" fill="none" />
        </svg>
        <div class="brand-logo" style="line-height: 1; margin: 0;">anticipate.</div>
      </div>
      <div class="brand-tagline" style="margin-left: 16px;">YOUR PERSONALISED FINANCIAL GUIDE</div>
    </div>
  </div>

  <!-- Test D: Sage 32px, Gap 4px, Tagline shifted right by 18px -->
  <div class="col-test">
    <h4>Test D: Sage 32px, Gap 4px, Tagline shifted right (18px)</h4>
    <div style="width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 2px;">
        <svg width="32" height="32" viewBox="0 0 100 100" fill="none" style="display: block;">
          <circle cx="50" cy="62" r="30" fill="#FFD4B8" stroke="#e9694a" stroke-width="3.5" />
          <path d="M50 32 L50 20" stroke="#5fab84" stroke-width="5" stroke-linecap="round" />
          <ellipse cx="42" cy="14" rx="6" ry="10" fill="#5fab84" />
          <ellipse cx="58" cy="14" rx="6" ry="10" fill="#5fab84" />
          <path d="M44 68 Q 50 74, 56 68" stroke="#1c1a24" stroke-width="3.5" stroke-linecap="round" fill="none" />
        </svg>
        <div class="brand-logo" style="line-height: 1; margin: 0;">anticipate.</div>
      </div>
      <div class="brand-tagline" style="margin-left: 18px;">YOUR PERSONALISED FINANCIAL GUIDE</div>
    </div>
  </div>

</body>
</html>
