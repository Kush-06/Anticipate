<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: monospace; background: white; margin: 40px; }
    #result { font-size: 18px; line-height: 1.5; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Badge Coordinate Scan Results</h2>
  <div id="result">Scanning...</div>
  <img id="badge-img" src="../store_badges.png" style="display:none;">
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    window.onload = function() {
      const img = document.getElementById('badge-img');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.naturalWidth || img.width || 642;
      canvas.height = img.naturalHeight || img.height || 164;
      ctx.drawImage(img, 0, 0);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      const boxes = [];
      const visited = new Uint8Array(width * height);

      function getPixel(x, y) {
        const idx = (y * width + x) * 4;
        return {
          r: data[idx],
          g: data[idx+1],
          b: data[idx+2],
          a: data[idx+3]
        };
      }

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const pix = getPixel(x, y);
          // A pixel is part of the black badge if it is very dark and not transparent
          if (pix.r < 40 && pix.g < 40 && pix.b < 40 && pix.a > 200 && !visited[y * width + x]) {
            let minX = x, maxX = x, minY = y, maxY = y;
            const queue = [[x, y]];
            visited[y * width + x] = 1;

            while (queue.length > 0) {
              const [cx, cy] = queue.shift();
              
              if (cx < minX) minX = cx;
              if (cx > maxX) maxX = cx;
              if (cy < minY) minY = cy;
              if (cy > maxY) maxY = cy;

              const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
              for (const [dx, dy] of dirs) {
                const nx = cx + dx;
                const ny = cy + dy;
                if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                  const nIdx = ny * width + nx;
                  if (!visited[nIdx]) {
                    const npix = getPixel(nx, ny);
                    if (npix.r < 40 && npix.g < 40 && npix.b < 40 && npix.a > 200) {
                      visited[nIdx] = 1;
                      queue.push([nx, ny]);
                    }
                  }
                }
              }
            }

            if ((maxX - minX > 50) && (maxY - minY > 20)) {
              boxes.push({ minX, maxX, minY, maxY, w: maxX - minX + 1, h: maxY - minY + 1 });
            }
          }
        }
      }

      let resText = `Image dimensions: ${width}x${height}\n\n`;
      resText += `Detected ${boxes.length} badges:\n`;
      boxes.forEach((box, i) => {
        resText += `Badge ${i + 1}:\n`;
        resText += `  X: ${box.minX} to ${box.maxX} (width: ${box.w})\n`;
        resText += `  Y: ${box.minY} to ${box.maxY} (height: ${box.h})\n`;
      });

      document.getElementById('result').innerText = resText;
    };
  </script>
</body>
</html>
